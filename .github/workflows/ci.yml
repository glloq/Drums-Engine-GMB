name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ hashFiles('engine/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Run native unit tests
        working-directory: engine
        run: pio test -e native

  firmware-build:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-esp32-${{ hashFiles('engine/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        working-directory: engine
        run: pio run -e esp32
      - name: Report flash/RAM usage
        working-directory: engine
        run: pio run -e esp32 --target size | tail -n 40
      # Keep the flashable images so a build can be tried on real hardware
      # without reproducing the toolchain locally.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            engine/.pio/build/esp32/firmware.bin
            engine/.pio/build/esp32/firmware.elf
            engine/.pio/build/esp32/bootloader.bin
            engine/.pio/build/esp32/partitions.bin
          if-no-files-found: error

  filesystem-build:
    name: Build LittleFS image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-esp32-${{ hashFiles('engine/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      # The web UI is served from LittleFS (data/index.html). Building the image
      # in CI catches a data/ payload that no longer fits the partition — which
      # would otherwise only show up at `pio run -t uploadfs` time.
      - name: Build filesystem image
        working-directory: engine
        run: pio run -e esp32 --target buildfs
      - name: Upload filesystem artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlefs-esp32
          path: engine/.pio/build/esp32/littlefs.bin
          if-no-files-found: error

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck (warnings, informational)
        working-directory: engine
        run: |
          cppcheck --std=c++17 --language=c++ \
            --enable=warning,performance,portability \
            --inline-suppr --suppress=missingInclude \
            -I src src 2>&1 | tee cppcheck.log || true
      - name: cppcheck (errors, gating)
        working-directory: engine
        # Fail the job only on genuine errors (null derefs, OOB, leaks, ...),
        # not on style/warning noise.
        run: |
          cppcheck --std=c++17 --language=c++ \
            --inline-suppr --suppress=missingInclude \
            --error-exitcode=1 \
            -I src src
