<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MidiPercussion V4</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --fg: #e0e0e0; --fg2: #a0a0b0; --accent: #e94560;
  --accent2: #533483; --success: #4caf50; --warn: #ff9800;
  --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
.header { background: var(--bg2); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent); }
.header h1 { font-size: 1.3em; font-weight: 600; }
.header .status { display: flex; gap: 12px; font-size: 0.85em; color: var(--fg2); }
.header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.dot.on { background: var(--success); } .dot.off { background: var(--accent); }

.tabs { display: flex; background: var(--bg2); border-bottom: 1px solid #333; }
.tab { padding: 10px 20px; cursor: pointer; color: var(--fg2); border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content { padding: 20px; max-width: 1200px; margin: 0 auto; }
.panel { display: none; } .panel.active { display: block; }

.card { background: var(--bg2); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card h3 { margin-bottom: 12px; font-size: 1.1em; display: flex; align-items: center; justify-content: space-between; }
.card .badge { background: var(--accent2); padding: 2px 8px; border-radius: 12px; font-size: 0.75em; }

.btn { padding: 8px 16px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9em; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #d63050; }
.btn-secondary { background: var(--bg3); color: var(--fg); }
.btn-secondary:hover { background: #1a4a80; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: #c62828; color: white; }
.btn-sm { padding: 4px 10px; font-size: 0.8em; }
.btn-icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; margin-bottom: 4px; font-size: 0.85em; color: var(--fg2); }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-row .form-group { flex: 1; min-width: 120px; }
input, select { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid #444; border-radius: var(--radius); color: var(--fg); font-size: 0.9em; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type=range] { padding: 0; }

.actuator-list { margin-top: 8px; }
.actuator-item { background: var(--bg); border-radius: var(--radius); padding: 10px; margin-bottom: 8px; border-left: 3px solid var(--accent2); }
.actuator-item .act-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.actuator-item .act-type { font-size: 0.8em; color: var(--accent); }

.instrument-list { display: grid; gap: 12px; }

/* Loop Grid */
.loop-grid { display: grid; grid-template-columns: 40px repeat(16, 1fr); gap: 2px; margin-top: 12px; }
.loop-cell { width: 100%; aspect-ratio: 1; background: var(--bg); border-radius: 3px; cursor: pointer; transition: background 0.1s; border: 1px solid #333; }
.loop-cell:hover { border-color: var(--accent); }
.loop-cell.active { background: var(--accent); border-color: var(--accent); }
.loop-cell.playing { animation: pulse 0.3s; }
.loop-label { font-size: 0.7em; color: var(--fg2); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; white-space: nowrap; overflow: hidden; }
.beat-marker { font-size: 0.65em; color: var(--fg2); text-align: center; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg2); border-radius: var(--radius); padding: 24px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); color: var(--fg); padding: 12px 20px; border-radius: var(--radius); box-shadow: var(--shadow); z-index: 200; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-left: 3px solid var(--accent); }
.toast.success { border-left: 3px solid var(--success); }

.empty-state { text-align: center; padding: 40px; color: var(--fg2); }
.empty-state p { margin: 8px 0; }

.transport { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.transport .bpm-display { font-size: 1.4em; font-weight: bold; min-width: 80px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>MidiPercussion V4</h1>
  <div class="status">
    <span><span class="dot" id="wifiDot"></span>WiFi: <span id="wifiStatus">--</span></span>
    <span><span class="dot" id="midiDot"></span>MIDI: <span id="midiStatus">--</span></span>
    <span>HW: <span id="hwStatus">--</span></span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="instruments">Instruments</div>
  <div class="tab" data-tab="test">Test</div>
  <div class="tab" data-tab="loops">Boucles</div>
  <div class="tab" data-tab="system">Systeme</div>
</div>

<div class="content">
  <!-- INSTRUMENTS TAB -->
  <div class="panel active" id="tab-instruments">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2>Instruments (<span id="instrCount">0</span>)</h2>
      <button class="btn btn-primary" onclick="showAddInstrument()">+ Ajouter</button>
    </div>
    <div class="instrument-list" id="instrumentList"></div>
  </div>

  <!-- TEST TAB -->
  <div class="panel" id="tab-test">
    <h2>Test des Actionneurs</h2>
    <div class="card" style="margin-top:16px;">
      <div class="form-row">
        <div class="form-group">
          <label>Instrument</label>
          <select id="testInstrument" onchange="updateTestActuators()">
            <option value="">-- Choisir --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Actionneur (optionnel)</label>
          <select id="testActuator">
            <option value="all">Tous (instrument complet)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Velocite / Valeur: <span id="testValLabel">80</span></label>
        <input type="range" id="testValue" min="0" max="127" value="80" oninput="document.getElementById('testValLabel').textContent=this.value">
      </div>
      <button class="btn btn-success" onclick="doTest()">Tester</button>
    </div>
  </div>

  <!-- LOOPS TAB -->
  <div class="panel" id="tab-loops">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2>Boucles</h2>
      <button class="btn btn-primary" onclick="showAddLoop()">+ Nouvelle Boucle</button>
    </div>
    <div id="loopList"></div>
    <div id="loopEditor" style="display:none;">
      <div class="card">
        <h3>
          <span id="loopEditorTitle">Editeur</span>
          <div>
            <button class="btn btn-sm btn-secondary" onclick="closeLoopEditor()">Fermer</button>
          </div>
        </h3>
        <div class="transport">
          <button class="btn btn-success btn-icon" onclick="playCurrentLoop()" id="btnPlay">&#9654;</button>
          <button class="btn btn-danger btn-icon" onclick="stopLoop()">&#9632;</button>
          <div class="bpm-display"><span id="loopBpmDisplay">120</span> BPM</div>
          <input type="range" id="loopBpmSlider" min="40" max="300" value="120"
                 oninput="updateLoopBpm(this.value)" style="flex:1;">
          <select id="loopQuantize" onchange="quantizeLoop(this.value)">
            <option value="0">Libre</option>
            <option value="4">1/4</option>
            <option value="8" selected>1/8</option>
            <option value="16">1/16</option>
          </select>
        </div>
        <div class="loop-grid" id="loopGrid"></div>
      </div>
    </div>
  </div>

  <!-- SYSTEM TAB -->
  <div class="panel" id="tab-system">
    <h2>Systeme</h2>
    <div class="card" style="margin-top:16px;">
      <h3>Etat</h3>
      <div id="systemInfo" style="font-size:0.9em;line-height:1.8;"></div>
      <div style="margin-top:12px;">
        <button class="btn btn-secondary" onclick="refreshStatus()">Actualiser</button>
        <button class="btn btn-secondary" onclick="scanI2C()">Scanner I2C</button>
        <button class="btn btn-primary" onclick="saveAll()">Sauvegarder tout</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px;">
      <h3>Bus I2C</h3>
      <div id="i2cInfo" style="font-size:0.9em;">Cliquez "Scanner I2C" pour detecter les modules</div>
    </div>
  </div>
</div>

<!-- MODAL: Add/Edit Instrument -->
<div class="modal-overlay" id="modalInstrument">
  <div class="modal">
    <h2 id="modalInstrTitle">Nouvel Instrument</h2>
    <input type="hidden" id="editInstrId" value="">
    <div class="form-row">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="instrName" placeholder="Grosse Caisse">
      </div>
      <div class="form-group">
        <label>Categorie</label>
        <select id="instrCategory">
          <option value="drums">Drums</option>
          <option value="cymbals">Cymbales</option>
          <option value="latin">Percussions Latin</option>
          <option value="other">Autre</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Note MIDI</label>
        <select id="instrMidiNote"></select>
      </div>
      <div class="form-group">
        <label>Canal MIDI</label>
        <select id="instrMidiChannel">
          <option value="0">Tous</option>
        </select>
      </div>
    </div>

    <h3 style="margin:16px 0 8px;">Actionneurs</h3>
    <div id="modalActuatorList"></div>
    <button class="btn btn-sm btn-secondary" onclick="addActuatorRow()" style="margin-top:8px;">+ Actionneur</button>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modalInstrument')">Annuler</button>
      <button class="btn btn-primary" onclick="saveInstrument()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL: Add Loop -->
<div class="modal-overlay" id="modalLoop">
  <div class="modal">
    <h2>Nouvelle Boucle</h2>
    <div class="form-group">
      <label>Nom</label>
      <input type="text" id="loopName" placeholder="Rock Beat">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>BPM</label>
        <input type="number" id="loopBpm" value="120" min="40" max="300">
      </div>
      <div class="form-group">
        <label>Mesures</label>
        <input type="number" id="loopBars" value="1" min="1" max="8">
      </div>
      <div class="form-group">
        <label>Signature</label>
        <select id="loopTimeSig">
          <option value="4/4">4/4</option>
          <option value="3/4">3/4</option>
          <option value="6/8">6/8</option>
          <option value="5/4">5/4</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modalLoop')">Annuler</button>
      <button class="btn btn-primary" onclick="createLoop()">Creer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// State
let instruments = [];
let loops = [];
let midiNotes = [];
let currentLoopIdx = -1;
let gridSubdivision = 8; // 1/8 notes

const ACTUATOR_TYPES = [
  {v:0, l:'Solenoid Strike', desc:'Frappe simple on/off'},
  {v:1, l:'Solenoid Hold',   desc:'Solenoide avec maintien PWM'},
  {v:2, l:'Servo Position',  desc:'Servo position (ouvert/ferme)'},
  {v:3, l:'Servo Strike',    desc:'Servo oscillant (maracas, shaker)'},
  {v:4, l:'Comb/Brush',      desc:'Peigne/brosse pour cymbales/snare'},
  {v:5, l:'Pitch Bend',      desc:'Tension de peau pour pitch bend'}
];
const TIMING_TYPES = [
  {v:0, l:'Pre-Strike'}, {v:1, l:'On Strike'}, {v:2, l:'Post-Strike'},
  {v:3, l:'On Release'}, {v:4, l:'Continuous'}
];
const CONTROL_TYPES = [
  {v:0, l:'Note Velocity'}, {v:1, l:'Control Change'}, {v:2, l:'Pitch Bend'},
  {v:3, l:'Aftertouch'}, {v:4, l:'Fixed Value'}
];
const BUS_TYPES = [
  {v:0, l:'MCP23017 (I2C GPIO)'}, {v:1, l:'PCA9685 (I2C PWM)'},
  {v:2, l:'ESP32 GPIO'}, {v:3, l:'ESP32 LEDC PWM'}
];

// --- API ---
async function api(path, method='GET', body=null) {
  const opts = {method, headers: {'Content-Type':'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch('/api/' + path, opts);
    return await r.json();
  } catch(e) {
    toast('Erreur reseau: ' + e.message, 'error');
    return null;
  }
}

// --- Init ---
async function init() {
  populateMidiSelects();
  await loadMidiNotes();
  await loadInstruments();
  await loadLoops();
  refreshStatus();
  setInterval(refreshStatus, 5000);
}

async function loadMidiNotes() {
  const data = await api('midi-notes');
  if (data) {
    midiNotes = data;
    populateMidiNoteSelect();
  }
}

function populateMidiSelects() {
  const ch = document.getElementById('instrMidiChannel');
  for (let i = 1; i <= 16; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = 'Ch ' + i;
    if (i === 10) o.textContent += ' (GM Drums)';
    ch.appendChild(o);
  }
  ch.value = '10';
}

function populateMidiNoteSelect() {
  const sel = document.getElementById('instrMidiNote');
  sel.innerHTML = '';
  midiNotes.forEach(n => {
    const o = document.createElement('option');
    o.value = n.note;
    o.textContent = n.note + ' - ' + n.name;
    sel.appendChild(o);
  });
  // Add generic range
  for (let i = 0; i < 128; i++) {
    if (!midiNotes.find(n => n.note === i)) {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = i + ' - Note ' + i;
      sel.appendChild(o);
    }
  }
}

// --- Instruments ---
async function loadInstruments() {
  const data = await api('instruments');
  if (data) {
    instruments = data;
    renderInstruments();
    updateTestInstrumentSelect();
  }
}

function renderInstruments() {
  const list = document.getElementById('instrumentList');
  document.getElementById('instrCount').textContent = instruments.length;

  if (instruments.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>Aucun instrument configure</p><p>Cliquez "+ Ajouter" pour commencer</p></div>';
    return;
  }

  list.innerHTML = instruments.map(inst => `
    <div class="card">
      <h3>
        <span>${inst.name} <span class="badge">${inst.category}</span> <span class="badge">Note ${inst.midiNote}</span></span>
        <span>
          <button class="btn btn-sm btn-secondary" onclick="editInstrument(${inst.id})">Modifier</button>
          <button class="btn btn-sm btn-danger" onclick="deleteInstrument(${inst.id})">Suppr</button>
        </span>
      </h3>
      <div class="actuator-list">
        ${inst.actuators.length === 0 ? '<div style="color:var(--fg2);font-size:0.85em;">Aucun actionneur</div>' :
          inst.actuators.map((a, i) => `
            <div class="actuator-item">
              <div class="act-header">
                <span><strong>${a.name}</strong> <span class="act-type">${ACTUATOR_TYPES[a.type]?.l||'?'}</span></span>
                <span style="font-size:0.8em;color:var(--fg2);">${TIMING_TYPES[a.timing]?.l||'?'} | ${BUS_TYPES[a.bus]?.l||'?'} @ 0x${a.hwAddress.toString(16)} pin ${a.hwPin}</span>
              </div>
              <div style="font-size:0.8em;color:var(--fg2);">
                Param: ${a.paramMin}-${a.paramMax} (def:${a.paramDefault}) | Delai: ${a.delayMs}ms | Ctrl: ${CONTROL_TYPES[a.control]?.l||'?'}
                ${a.control===1 ? '(CC#'+a.ccNumber+')' : ''}
              </div>
            </div>
          `).join('')}
      </div>
    </div>
  `).join('');
}

function showAddInstrument() {
  document.getElementById('modalInstrTitle').textContent = 'Nouvel Instrument';
  document.getElementById('editInstrId').value = '';
  document.getElementById('instrName').value = '';
  document.getElementById('instrCategory').value = 'drums';
  document.getElementById('instrMidiNote').value = '36';
  document.getElementById('instrMidiChannel').value = '10';
  document.getElementById('modalActuatorList').innerHTML = '';
  addActuatorRow(); // Start with one actuator
  showModal('modalInstrument');
}

function editInstrument(id) {
  const inst = instruments.find(i => i.id === id);
  if (!inst) return;
  document.getElementById('modalInstrTitle').textContent = 'Modifier: ' + inst.name;
  document.getElementById('editInstrId').value = id;
  document.getElementById('instrName').value = inst.name;
  document.getElementById('instrCategory').value = inst.category;
  document.getElementById('instrMidiNote').value = inst.midiNote;
  document.getElementById('instrMidiChannel').value = inst.midiChannel;
  document.getElementById('modalActuatorList').innerHTML = '';
  inst.actuators.forEach(a => addActuatorRow(a));
  if (inst.actuators.length === 0) addActuatorRow();
  showModal('modalInstrument');
}

async function saveInstrument() {
  const id = document.getElementById('editInstrId').value;
  const data = {
    name: document.getElementById('instrName').value || 'Unnamed',
    category: document.getElementById('instrCategory').value,
    midiNote: parseInt(document.getElementById('instrMidiNote').value),
    midiChannel: parseInt(document.getElementById('instrMidiChannel').value),
    enabled: true,
    actuators: collectActuators()
  };

  if (id) {
    await api('instrument?id=' + id, 'PUT', data);
  } else {
    await api('instruments', 'POST', data);
  }
  closeModal('modalInstrument');
  await loadInstruments();
  toast('Instrument enregistre', 'success');
}

async function deleteInstrument(id) {
  if (!confirm('Supprimer cet instrument ?')) return;
  await api('instrument?id=' + id, 'DELETE');
  await loadInstruments();
  toast('Instrument supprime', 'success');
}

// --- Actuator rows in modal ---
let actRowCounter = 0;
function addActuatorRow(data = null) {
  const idx = actRowCounter++;
  const d = data || {name:'', type:0, timing:1, control:0, bus:0, hwAddress:0x20, hwPin:0, paramMin:8, paramMax:30, paramDefault:15, delayMs:0, ccNumber:0, enabled:true};
  const html = `
    <div class="actuator-item" id="actRow${idx}">
      <div class="act-header">
        <strong>Actionneur</strong>
        <button class="btn btn-sm btn-danger" onclick="document.getElementById('actRow${idx}').remove()">X</button>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Nom</label><input type="text" class="act-name" value="${d.name}"></div>
        <div class="form-group"><label>Type</label><select class="act-type">${ACTUATOR_TYPES.map(t=>`<option value="${t.v}" ${t.v===d.type?'selected':''}>${t.l}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Timing</label><select class="act-timing">${TIMING_TYPES.map(t=>`<option value="${t.v}" ${t.v===d.timing?'selected':''}>${t.l}</option>`).join('')}</select></div>
        <div class="form-group"><label>Controle</label><select class="act-control">${CONTROL_TYPES.map(t=>`<option value="${t.v}" ${t.v===d.control?'selected':''}>${t.l}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Bus</label><select class="act-bus">${BUS_TYPES.map(t=>`<option value="${t.v}" ${t.v===d.bus?'selected':''}>${t.l}</option>`).join('')}</select></div>
        <div class="form-group"><label>Adresse I2C</label><input type="text" class="act-addr" value="0x${d.hwAddress.toString(16)}"></div>
        <div class="form-group"><label>Pin/Channel</label><input type="number" class="act-pin" value="${d.hwPin}" min="0" max="15"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Param Min</label><input type="number" class="act-pmin" value="${d.paramMin}"></div>
        <div class="form-group"><label>Param Max</label><input type="number" class="act-pmax" value="${d.paramMax}"></div>
        <div class="form-group"><label>Par Defaut</label><input type="number" class="act-pdef" value="${d.paramDefault}"></div>
        <div class="form-group"><label>Delai (ms)</label><input type="number" class="act-delay" value="${d.delayMs}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>CC#</label><input type="number" class="act-cc" value="${d.ccNumber}" min="0" max="127"></div>
      </div>
    </div>`;
  document.getElementById('modalActuatorList').insertAdjacentHTML('beforeend', html);
}

function collectActuators() {
  const rows = document.querySelectorAll('#modalActuatorList .actuator-item');
  return Array.from(rows).map(row => ({
    name: row.querySelector('.act-name').value || 'Actuator',
    type: parseInt(row.querySelector('.act-type').value),
    timing: parseInt(row.querySelector('.act-timing').value),
    control: parseInt(row.querySelector('.act-control').value),
    bus: parseInt(row.querySelector('.act-bus').value),
    hwAddress: parseInt(row.querySelector('.act-addr').value),
    hwPin: parseInt(row.querySelector('.act-pin').value),
    paramMin: parseInt(row.querySelector('.act-pmin').value),
    paramMax: parseInt(row.querySelector('.act-pmax').value),
    paramDefault: parseInt(row.querySelector('.act-pdef').value),
    delayMs: parseInt(row.querySelector('.act-delay').value),
    ccNumber: parseInt(row.querySelector('.act-cc').value),
    enabled: true
  }));
}

// --- Test ---
function updateTestInstrumentSelect() {
  const sel = document.getElementById('testInstrument');
  sel.innerHTML = '<option value="">-- Choisir --</option>';
  instruments.forEach(inst => {
    const o = document.createElement('option');
    o.value = inst.id;
    o.textContent = inst.name + ' (Note ' + inst.midiNote + ')';
    sel.appendChild(o);
  });
}

function updateTestActuators() {
  const instId = document.getElementById('testInstrument').value;
  const sel = document.getElementById('testActuator');
  sel.innerHTML = '<option value="all">Tous (instrument complet)</option>';
  if (!instId) return;
  const inst = instruments.find(i => i.id == instId);
  if (!inst) return;
  inst.actuators.forEach((a, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = a.name + ' (' + ACTUATOR_TYPES[a.type]?.l + ')';
    sel.appendChild(o);
  });
}

async function doTest() {
  const instId = document.getElementById('testInstrument').value;
  if (!instId) { toast('Choisissez un instrument', 'error'); return; }
  const actIdx = document.getElementById('testActuator').value;
  const val = parseInt(document.getElementById('testValue').value);

  if (actIdx === 'all') {
    await api('test/instrument', 'POST', {id: parseInt(instId), velocity: val});
  } else {
    await api('test/actuator', 'POST', {instrumentId: parseInt(instId), index: parseInt(actIdx), value: val});
  }
  toast('Test envoye', 'success');
}

// --- Loops ---
async function loadLoops() {
  const data = await api('loops');
  if (data) { loops = data; renderLoops(); }
}

function renderLoops() {
  const list = document.getElementById('loopList');
  if (loops.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>Aucune boucle</p></div>';
    return;
  }
  list.innerHTML = loops.map((loop, i) => `
    <div class="card">
      <h3>
        <span>${loop.name} <span class="badge">${loop.bpm} BPM</span> <span class="badge">${loop.bars} mes.</span></span>
        <span>
          <button class="btn btn-sm btn-success" onclick="openLoopEditor(${i})">Editer</button>
          <button class="btn btn-sm btn-danger" onclick="deleteLoopItem(${i})">Suppr</button>
        </span>
      </h3>
    </div>
  `).join('');
}

function showAddLoop() { showModal('modalLoop'); }

async function createLoop() {
  const ts = document.getElementById('loopTimeSig').value.split('/');
  const data = {
    name: document.getElementById('loopName').value || 'New Loop',
    bpm: parseInt(document.getElementById('loopBpm').value) || 120,
    bars: parseInt(document.getElementById('loopBars').value) || 1,
    beatsPerBar: parseInt(ts[0]),
    beatValue: parseInt(ts[1])
  };
  await api('loops', 'POST', data);
  closeModal('modalLoop');
  await loadLoops();
  toast('Boucle creee', 'success');
}

async function deleteLoopItem(idx) {
  if (!confirm('Supprimer cette boucle ?')) return;
  await api('loop?id=' + idx, 'DELETE');
  await loadLoops();
}

function openLoopEditor(idx) {
  currentLoopIdx = idx;
  const loop = loops[idx];
  if (!loop) return;
  document.getElementById('loopEditorTitle').textContent = 'Editeur: ' + loop.name;
  document.getElementById('loopBpmDisplay').textContent = loop.bpm;
  document.getElementById('loopBpmSlider').value = loop.bpm;
  document.getElementById('loopEditor').style.display = 'block';
  renderLoopGrid(loop);
}

function closeLoopEditor() {
  document.getElementById('loopEditor').style.display = 'none';
  currentLoopIdx = -1;
}

function renderLoopGrid(loop) {
  const grid = document.getElementById('loopGrid');
  const ppq = loop.ppq || 96;
  const beatsPerBar = loop.beatsPerBar || 4;
  const bars = loop.bars || 1;
  const totalBeats = beatsPerBar * bars;
  const subdivision = parseInt(document.getElementById('loopQuantize').value) || 8;
  const stepsPerBeat = subdivision / (loop.beatValue || 4);
  const totalSteps = totalBeats * stepsPerBeat;
  const ticksPerStep = (ppq * 4) / subdivision;

  // Use instruments that are configured
  const rows = instruments.length > 0 ? instruments : [{id:0, name:'(aucun)', midiNote:36}];

  let html = '';
  // Header row - beat markers
  html += '<div></div>';
  for (let s = 0; s < totalSteps && s < 32; s++) {
    const beat = Math.floor(s / stepsPerBeat) + 1;
    const sub = (s % stepsPerBeat) + 1;
    html += `<div class="beat-marker">${sub === 1 ? beat : '.'}</div>`;
  }

  // Instrument rows
  rows.forEach(inst => {
    html += `<div class="loop-label" title="${inst.name}">${inst.name.substring(0, 8)}</div>`;
    for (let s = 0; s < totalSteps && s < 32; s++) {
      const tick = Math.round(s * ticksPerStep);
      const events = (loop.events || []);
      const isActive = events.some(e =>
        e[1] === inst.midiNote && Math.abs(e[0] - tick) < ticksPerStep/2 && e[2] > 0
      );
      html += `<div class="loop-cell ${isActive ? 'active' : ''}"
                    onclick="toggleLoopCell(${currentLoopIdx}, ${inst.midiNote}, ${tick}, ${ticksPerStep}, this)"
                    data-note="${inst.midiNote}" data-tick="${tick}"></div>`;
    }
  });

  grid.style.gridTemplateColumns = `60px repeat(${Math.min(totalSteps, 32)}, 1fr)`;
  grid.innerHTML = html;
}

async function toggleLoopCell(loopIdx, note, tick, ticksPerStep, el) {
  if (loopIdx < 0 || loopIdx >= loops.length) return;
  const loop = loops[loopIdx];
  const events = loop.events || [];

  // Find existing event
  const existingIdx = events.findIndex(e =>
    e[1] === note && Math.abs(e[0] - tick) < ticksPerStep/2 && e[2] > 0
  );

  if (existingIdx >= 0) {
    events.splice(existingIdx, 1);
    el.classList.remove('active');
  } else {
    events.push([tick, note, 80, 10]); // tick, note, velocity, channel
    el.classList.add('active');
  }

  loop.events = events;
  await api('loop?id=' + loopIdx, 'PUT', loop);
}

function updateLoopBpm(val) {
  document.getElementById('loopBpmDisplay').textContent = val;
  if (currentLoopIdx >= 0 && loops[currentLoopIdx]) {
    loops[currentLoopIdx].bpm = parseInt(val);
    api('loop?id=' + currentLoopIdx, 'PUT', loops[currentLoopIdx]);
  }
}

async function quantizeLoop(val) {
  if (currentLoopIdx < 0) return;
  renderLoopGrid(loops[currentLoopIdx]);
}

async function playCurrentLoop() {
  if (currentLoopIdx < 0) return;
  await api('loop/play?id=' + currentLoopIdx, 'POST');
  toast('Lecture...', 'success');
}

async function stopLoop() {
  await api('loop/stop', 'POST');
}

// --- System ---
async function refreshStatus() {
  const data = await api('status');
  if (!data) return;

  document.getElementById('wifiDot').className = 'dot ' + (data.wifi_ip ? 'on' : 'off');
  document.getElementById('wifiStatus').textContent = data.wifi_ip || 'Deconnecte';
  document.getElementById('midiDot').className = 'dot ' + (data.midi_connected ? 'on' : 'off');
  document.getElementById('midiStatus').textContent = data.midi_connected ? data.midi_sessions + ' session(s)' : 'Aucune';
  document.getElementById('hwStatus').textContent = data.mcp_count + ' MCP + ' + data.pca_count + ' PCA';

  document.getElementById('systemInfo').innerHTML = `
    <div><strong>WiFi:</strong> ${data.wifi_ssid} (${data.wifi_ip}) RSSI: ${data.wifi_rssi}dBm</div>
    <div><strong>MIDI:</strong> ${data.midi_connected?'Connecte':'Deconnecte'} | RX: ${data.midi_notes_rx} | TX: ${data.midi_notes_tx}</div>
    <div><strong>Hardware:</strong> ${data.mcp_count} MCP23017 + ${data.pca_count} PCA9685</div>
    <div><strong>Instruments:</strong> ${data.instrument_count} configures</div>
    <div><strong>Boucles:</strong> ${data.loop_count} ${data.loop_playing?'(en lecture: '+data.loop_bpm+' BPM)':''}</div>
    <div><strong>Memoire:</strong> ${(data.free_heap/1024).toFixed(1)} KB libre</div>
    <div><strong>Stockage:</strong> ${data.storage}</div>
    <div><strong>Uptime:</strong> ${Math.floor(data.uptime_s/3600)}h ${Math.floor((data.uptime_s%3600)/60)}m ${data.uptime_s%60}s</div>
  `;
}

async function scanI2C() {
  const data = await api('scan-i2c');
  if (data) {
    document.getElementById('i2cInfo').innerHTML = '<strong>Modules detectes:</strong> ' + data.devices;
  }
}

async function saveAll() {
  await api('save', 'POST');
  toast('Configuration sauvegardee', 'success');
}

// --- UI Helpers ---
function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Init on load
window.addEventListener('load', init);
</script>
