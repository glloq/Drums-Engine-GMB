; ============================================================================
; Drums Engine - PlatformIO configuration for ESP32
; ============================================================================
;
; Architecture: 6-layer modular real-time percussion engine
;   HAL -> Actuator -> Scheduler -> Event Engine -> MIDI -> Web
;
; Build & Upload:
;   pio run -t upload
;
; Upload filesystem (web UI):
;   pio run -t uploadfs
;
; Serial monitor:
;   pio device monitor
;
; ============================================================================

[env:esp32]
; --- Toolchain ---------------------------------------------------------------
; This firmware targets Arduino-ESP32 3.x / ESP-IDF 5.x:
;   * src/led/led_strip_driver.cpp uses the ESP-IDF 5.x RMT driver
;     (driver/rmt_tx.h, rmt_new_tx_channel / rmt_new_bytes_encoder);
;   * src/hal/ledc_driver.cpp prefers ledcAttach (it keeps a core-2.x fallback,
;     but the RMT driver has none).
;
; The official platformio/espressif32 platform still ships Arduino-ESP32 2.0.17
; (ESP-IDF 4.4.x) — including 6.9.0, despite what the previous comment here
; claimed. Building this source tree against it fails on driver/rmt_tx.h, so the
; platform is pinned to the pioarduino community fork, which is the supported
; way to get Arduino core 3.x under PlatformIO.
;
; 54.03.21 -> Arduino-ESP32 3.2.1 / ESP-IDF 5.4.2.
;
; The async web server uses the maintained ESP32Async forks; the abandoned
; me-no-dev ESPAsyncWebServer/AsyncTCP do not build on core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Libraries ---------------------------------------------------------------
; Pinned to exact versions: a firmware that drives solenoids and motors should
; not change behaviour because an upstream library published a minor release.
; Note the owner of "MIDI Library" is fortyseveneffects, not lathoub — the
; wrong owner is what made dependency resolution fail in CI.
lib_deps =
  adafruit/Adafruit MCP23017 Arduino Library@2.3.2
  adafruit/Adafruit PWM Servo Driver Library@3.0.3
  bblanchon/ArduinoJson@7.4.3
  esp32async/ESPAsyncWebServer@3.12.0
  esp32async/AsyncTCP@3.5.0
  lathoub/AppleMIDI@3.3.0
  fortyseveneffects/MIDI Library@5.0.2

; --- Build flags ---
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -DARDUINO_LOOP_STACK_SIZE=16384
  -Wall
  -Wno-unused-variable

; --- Filesystem (LittleFS for web UI) ---
board_build.filesystem = littlefs

; --- Upload ---
upload_speed = 921600

; --- Partitions (larger app + LittleFS) ---
; default.csv only gives the app 1.25 MB, and this firmware links to ~1.5 MB on
; Arduino-ESP32 3.x (CORE_DEBUG_LEVEL=3, async web server, MIDI, LED/RMT), so it
; overflowed the app partition. huge_app.csv gives a single 3 MB app slot plus a
; 896 kB filesystem for the web UI and the JSON configs. There is no OTA route
; in this firmware, so dropping the second app slot costs nothing.
board_build.partitions = huge_app.csv

; ============================================================================
; Native (host) environment — pure-logic unit tests, no hardware toolchain.
; Run:  pio test -e native
; Only self-contained modules (e.g. the scheduler CommandQueue) are exercised
; here; the test pulls in the .cpp directly and uses the shims in test/stubs.
; ============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -DDEBUG_SERIAL=0
  -Itest/stubs
  -Wall
