; ============================================================================
; Drums Engine - PlatformIO configuration for ESP32
; ============================================================================
;
; Architecture: 6-layer modular real-time percussion engine
;   HAL -> Actuator -> Scheduler -> Event Engine -> MIDI -> Web
;
; Build & Upload:
;   pio run -t upload
;
; Upload filesystem (web UI):
;   pio run -t uploadfs
;
; Serial monitor:
;   pio device monitor
;
; ============================================================================

[env:esp32]
; Pin the platform (and therefore the ESP32 Arduino core) to a version that is
; compatible with the me-no-dev ESPAsyncWebServer/AsyncTCP libraries below.
; The latest espressif32 pulls Arduino core 3.x, on which those (now abandoned)
; libraries fail to compile — which is what broke the CI firmware build.
; 6.5.0 -> Arduino-ESP32 2.0.14 (stable, known-good with these deps).
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Libraries ---
lib_deps =
  adafruit/Adafruit MCP23017 Arduino Library@^2.3.0
  adafruit/Adafruit PWM Servo Driver Library@^3.0.0
  bblanchon/ArduinoJson@^7.0.0
  me-no-dev/ESPAsyncWebServer@^1.2.3
  me-no-dev/AsyncTCP@^1.1.1
  lathoub/AppleMIDI@^3.2.0
  lathoub/MIDI Library@^5.0.2

; --- Build flags ---
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM=0
  -DARDUINO_LOOP_STACK_SIZE=16384
  -Wall
  -Wno-unused-variable

; --- Filesystem (LittleFS for web UI) ---
board_build.filesystem = littlefs

; --- Upload ---
upload_speed = 921600

; --- Partitions (larger app + LittleFS) ---
board_build.partitions = default.csv

; ============================================================================
; Native (host) environment — pure-logic unit tests, no hardware toolchain.
; Run:  pio test -e native
; Only self-contained modules (e.g. the scheduler CommandQueue) are exercised
; here; the test pulls in the .cpp directly and uses the shims in test/stubs.
; ============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -DDEBUG_SERIAL=0
  -Itest/stubs
  -Wall
